{% extends 'base.html' %}

{% block head %}
<title>View</title>
{% endblock %}

{% block body %}
{% if file_url %}
    <div class="image-container">
        <img src="{{ file_url }}" alt="Attached file">
    </div>
{% endif %}

<div class="content">
    <h1 class="page-title">{{article.title}}</h1>
    <p class="article-text">{{article.content}}</p>
    <div class="btn-container">
        <a href="/" class="btn-action">Menu</a>
    </div>
</div>
{% endblock %}
