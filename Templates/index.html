{% extends 'base.html' %}

{% block head %}
<title>Fake news</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 class="page-title">Articles - News</h1>
    <table class="articles-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Date Added</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for article in articles %}
                <tr>
                    <td class="col-title">{{ article.title }}</td>
                    <td class="col-date">{{ article.date_created.date() }}</td>
                    <td class="col-actions">
                        <a href="/update/{{article.id}}">Edit</a>
                        <a href="/delete/{{article.id}}">Delete</a>
                        <a href="/view/{{article.id}}">View</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="btn-container">
        <a href="/post/" class="btn-action">New</a>
    </div>
</div>
{% endblock %}
