{% extends 'base.html' %}

{% block head %}
<title>Update</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 class="page-title">Update Article</h1>
    <div class="form-container">
        <form action="/update/{{article.id}}" method="POST" class="form">
            <input type="text" name="title" id="title" value="{{article.title}}" required>
            <input type="text" name="content" value="{{article.content}}" required>
            <input type="submit" value="Update">
        </form>
    </div>
    <div class="btn-container">
        <a href="/" class="btn-action">Cancel</a>
    </div>
</div>
{% endblock %}
