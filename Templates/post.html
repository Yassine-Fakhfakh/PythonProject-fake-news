{% extends 'base.html' %}

{% block head %}
<title>Post</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 class="page-title">New Article</h1>
    <h4 class="form-subtitle">Create a new article below!</h4>
    <div class="form-container">
        <form action="/post/" method="POST" class="form">
            <input type="text" name="title" id="title" placeholder="Article's title" required>
            <input type="text" name="content" placeholder="Article's content" required>
            <input type="submit" value="Publish">
        </form>
    </div>
    <div class="btn-container">
        <a href="/" class="btn-action">Cancel</a>
    </div>
</div>
{% endblock %}
